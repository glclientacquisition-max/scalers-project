# Lookup release gate. Runs when voice, brain, or prompt code changes.

name: Eval release

on:
  pull_request:
    paths:
      - "src/conversation/**"
      - "src/knowledge/**"
      - "src/prompts.js"
      - "server.js"
      - "evals/replay/**"
      - "scripts/eval-release.js"
      - "scripts/eval-fact-refs.js"

jobs:
  eval-release:
    name: eval:release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: eval:release
        run: npm run eval:release
