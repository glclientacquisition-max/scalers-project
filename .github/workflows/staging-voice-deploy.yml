# One-off: deploy THIS git commit to Railway staging Voice.
# Default path: land on cursor/staging-voice-468b (Railway staging follows that branch).
# Do not connect the service with a commit SHA. A pin ignores later pushes to
# that branch. stage-pull-request.yml reconnects the branch with no SHA.
# Desk previews are not Voice. Do not merge to main to get a DID test.
#
# GitHub → Actions → Deploy staging Voice → Run workflow from the PR branch.
# Type `staging` in confirm_target. Then check /healthz.gitSha before calling.

name: Deploy staging Voice

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Type staging to deploy this commit to Railway staging Voice only
        required: true
        type: string

concurrency:
  group: staging-voice-deploy
  cancel-in-progress: false

jobs:
  deploy-staging-voice:
    name: Deploy this commit to staging Voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit staging confirmation
        run: |
          if [ "${{ inputs.confirm_target }}" != "staging" ]; then
            echo "Refusing: confirm_target must be exactly staging"
            exit 1
          fi

      - name: Check Railway staging secrets
        id: secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_STAGING_PROJECT_ID: ${{ secrets.RAILWAY_STAGING_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_STAGING_PROJECT_ID RAILWAY_STAGING_SERVICE_ID RAILWAY_STAGING_ENVIRONMENT_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set. Add it under repo Settings → Secrets. Do not merge to main to test Voice."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Guard Railway target is staging and not ALCR
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_STAGING_PROJECT_ID }}
          SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          # RAILWAY_TOKEN is a project token scoped to one environment.
          # Project tokens authenticate with Project-Access-Token. Bearer is rejected.
          GQL=https://backboard.railway.com/graphql/v2
          AUTH=(-H "Project-Access-Token: $RAILWAY_TOKEN" -H "Content-Type: application/json" -H "User-Agent: scalers-staging-voice-deploy")

          TOKEN=$(curl -sS "$GQL" "${AUTH[@]}" \
            -d '{"query":"query { projectToken { projectId environmentId } }"}')
          echo "$TOKEN" | python3 -c '
          import json, os, sys
          body = json.load(sys.stdin)
          if body.get("errors"):
              raise SystemExit("Railway project token lookup failed: " + json.dumps(body["errors"]))
          token = ((body.get("data") or {}).get("projectToken") or {})
          project_id = str(token.get("projectId") or "")
          environment_id = str(token.get("environmentId") or "")
          print("project_token_project=" + project_id)
          print("project_token_environment=" + environment_id)
          if project_id != os.environ["PROJECT_ID"]:
              raise SystemExit("Refusing: project token projectId does not match RAILWAY_STAGING_PROJECT_ID")
          if environment_id != os.environ["ENVIRONMENT_ID"]:
              raise SystemExit("Refusing: project token environmentId does not match RAILWAY_STAGING_ENVIRONMENT_ID")
          '

          PROJECT=$(curl -sS "$GQL" "${AUTH[@]}" \
            -d "{\"query\":\"query(\$id: String!) { project(id: \$id) { id environments { edges { node { id name } } } services { edges { node { id name } } } } }\",\"variables\":{\"id\":\"$PROJECT_ID\"}}")
          echo "$PROJECT" | python3 -c '
          import json, os, sys
          body = json.load(sys.stdin)
          if body.get("errors"):
              raise SystemExit("Railway project lookup failed: " + json.dumps(body["errors"]))
          project = ((body.get("data") or {}).get("project") or {})
          if str(project.get("id") or "") != os.environ["PROJECT_ID"]:
              raise SystemExit("Refusing: Railway project id does not match RAILWAY_STAGING_PROJECT_ID")

          def nodes(connection):
              if isinstance(connection, dict) and isinstance(connection.get("edges"), list):
                  found = []
                  for edge in connection["edges"]:
                      if isinstance(edge, dict) and isinstance(edge.get("node"), dict):
                          found.append(edge["node"])
                  return found
              if isinstance(connection, list):
                  return [item for item in connection if isinstance(item, dict)]
              return []

          environment_id = os.environ["ENVIRONMENT_ID"]
          match = next((node for node in nodes(project.get("environments")) if str(node.get("id") or "") == environment_id), None)
          if match is None:
              raise SystemExit("Refusing: RAILWAY_STAGING_ENVIRONMENT_ID is not an environment on this project")
          name = str(match.get("name") or "")
          print("railway_environment=" + name)
          if name != "staging":
              raise SystemExit("Refusing: Railway environment name is %r, expected staging" % name)

          service_id = os.environ["SERVICE_ID"]
          service = next((node for node in nodes(project.get("services")) if str(node.get("id") or "") == service_id), None)
          if service is None:
              raise SystemExit("Refusing: RAILWAY_STAGING_SERVICE_ID is not a service on this project")
          print("railway_service=" + str(service.get("name") or service_id))
          '

          VARS=$(curl -sS "$GQL" "${AUTH[@]}" \
            -d "{\"query\":\"query(\$projectId: String!, \$environmentId: String!, \$serviceId: String) { variables(projectId: \$projectId, environmentId: \$environmentId, serviceId: \$serviceId) }\",\"variables\":{\"projectId\":\"$PROJECT_ID\",\"environmentId\":\"$ENVIRONMENT_ID\",\"serviceId\":\"$SERVICE_ID\"}}")
          echo "$VARS" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          if body.get("errors"):
              raise SystemExit("Railway variables lookup failed: " + json.dumps(body["errors"]))
          variables = (body.get("data") or {}).get("variables") or {}
          if isinstance(variables, list):
              mapped = {}
              for item in variables:
                  if isinstance(item, dict) and item.get("name"):
                      mapped[item["name"]] = item.get("value") or ""
              variables = mapped
          if not isinstance(variables, dict):
              raise SystemExit("Unexpected Railway variables shape")
          url = str(variables.get("SUPABASE_URL") or "")
          print("supabase_url_host_present=" + str(bool(url)))
          if "fjxcdccgyhnvnnlnovcl" in url:
              raise SystemExit("Refusing: target SUPABASE_URL points at production ALCR")
          if url and "sgcdncjxauhsbunobmob" not in url:
              raise SystemExit("Refusing: target SUPABASE_URL is not staging sgcdncjxauhsbunobmob")
          '

      - name: Stamp this commit for /healthz.gitSha
        run: printf '%s\n' "${GITHUB_SHA}" > scripts/.deploy-sha

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy this checkout to staging Voice
        env:
          # Project token. The CLI reads this name. RAILWAY_API_TOKEN is an
          # account token (Bearer) and must not be set alongside it.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_STAGING_PROJECT_ID }}
          SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          unset RAILWAY_API_TOKEN
          GQL=https://backboard.railway.com/graphql/v2
          AUTH=(-H "Project-Access-Token: $RAILWAY_TOKEN" -H "Content-Type: application/json" -H "User-Agent: scalers-staging-voice-deploy")
          DEPLOYED=0
          RESP=$(curl -sS "$GQL" "${AUTH[@]}" \
            -d "{\"query\":\"mutation(\$serviceId: String!, \$environmentId: String!, \$commitSha: String) { serviceInstanceDeployV2(serviceId: \$serviceId, environmentId: \$environmentId, commitSha: \$commitSha) }\",\"variables\":{\"serviceId\":\"$SERVICE_ID\",\"environmentId\":\"$ENVIRONMENT_ID\",\"commitSha\":\"$GITHUB_SHA\"}}") || true
          echo "$RESP"
          DID=$(echo "$RESP" | python3 -c 'import json,sys
          try:
            body=json.load(sys.stdin)
            print((body.get("data") or {}).get("serviceInstanceDeployV2") or "")
          except Exception:
            print("")')
          if [ -n "$DID" ]; then
            echo "Triggered Railway GitHub deploy $DID for $GITHUB_SHA"
            DEPLOYED=1
          else
            echo "GraphQL commit deploy unavailable. Uploading this checkout with railway up."
            railway up --ci --detach \
              --project "$PROJECT_ID" \
              --environment staging \
              --service "$SERVICE_ID"
            DEPLOYED=1
          fi
          if [ "$DEPLOYED" -ne 1 ]; then
            echo "Railway staging deploy did not start"
            exit 1
          fi

      - name: Wait until staging /healthz.gitSha matches this commit
        env:
          STAGING_VOICE_URL: ${{ vars.STAGING_VOICE_URL }}
        run: |
          set -euo pipefail
          URL="${STAGING_VOICE_URL:-https://scalers-staging-staging.up.railway.app}"
          WANT="${GITHUB_SHA}"
          SHORT="${GITHUB_SHA:0:7}"
          echo "Waiting for $URL/healthz gitSha=$SHORT"
          for i in $(seq 1 40); do
            BODY=$(curl -sS "$URL/healthz" || true)
            echo "[$i] $BODY"
            MATCH=$(echo "$BODY" | python3 -c '
          import json, sys
          want = """'"$WANT"'"""
          short = """'"$SHORT"'"""
          try:
              body = json.load(sys.stdin)
          except Exception:
              print("0")
              raise SystemExit(0)
          sha = str(body.get("gitSha") or "")
          print("1" if sha and (sha == want or sha.startswith(short)) else "0")
          ')
            if [ "$MATCH" = "1" ]; then
              echo "Staging Voice is running $SHORT"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for staging /healthz.gitSha to match $SHORT"
          echo "Do not call the DID until gitSha matches. Re-run this workflow after checking Railway logs."
          exit 1
