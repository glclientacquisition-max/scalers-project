# Rebuild cursor/staging-voice-468b as main plus every open pull request.
# A pull request into another feature branch is included on the next rebuild.
# Changing its base to main starts a rebuild. Closing a pull request rebuilds
# staging without it.
# Production still follows main.
# This workflow runs from main (pull_request_target) and only git-merges pull
# request refs. It does not install or run code from those pull requests.
#
# Railway scalers staging must follow this branch with no commit SHA. A pin
# ignores later pushes. After the git rebuild, this workflow connects the
# staging Voice service to the branch again so a pin cannot stick.
# Preview deploys do not take scalers-staging.vercel.app. This workflow assigns
# that hostname to the READY deploy of this branch. It does not touch
# scalers-project or scalers.co.ke.

name: Stage pull request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: stage-pull-request
  cancel-in-progress: false

jobs:
  stage:
    name: Rebuild staging branch
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref != 'cursor/staging-voice-468b')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild staging from main and open pull requests
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_EVENT: ${{ github.event.action }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          STAGE_RESULT_PATH: ${{ runner.temp }}/stage-result.json
        run: node scripts/stage-pull-request.js
        continue-on-error: true

      - name: Connect Railway staging Voice to the staging branch
        if: always() && steps.stage.outcome != 'skipped'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_STAGING_PROJECT_ID != '' && secrets.RAILWAY_STAGING_PROJECT_ID || '7d397b45-3d3d-4939-bd2b-a0e1e71d9dd7' }}
          SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID != '' && secrets.RAILWAY_STAGING_SERVICE_ID || 'e37d143d-d0ca-4d02-8cdf-347eb3fc647b' }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID != '' && secrets.RAILWAY_STAGING_ENVIRONMENT_ID || '99dd41c1-2f1a-4763-a8a1-7c9f3bd87d13' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Staging Voice will stay on whatever commit it is pinned to."
            exit 1
          fi
          GQL=https://backboard.railway.com/graphql/v2
          AUTH=(-H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" -H "User-Agent: scalers-stage-pull-request")
          RESP=$(curl -sS "$GQL" "${AUTH[@]}" \
            -d "{\"query\":\"query(\$id: String!) { environment(id: \$id) { name } }\",\"variables\":{\"id\":\"$ENVIRONMENT_ID\"}}")
          echo "$RESP" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          if body.get("errors"):
              raise SystemExit("Railway environment lookup failed: " + json.dumps(body["errors"]))
          name = ((body.get("data") or {}).get("environment") or {}).get("name") or ""
          print("railway_environment=" + name)
          if name.strip().lower() != "staging":
              raise SystemExit("Refusing: Railway environment name is %r, expected staging" % name)
          '
          VARS=$(curl -sS "$GQL" "${AUTH[@]}" \
            -d "{\"query\":\"query(\$projectId: String!, \$environmentId: String!, \$serviceId: String) { variables(projectId: \$projectId, environmentId: \$environmentId, serviceId: \$serviceId) }\",\"variables\":{\"projectId\":\"$PROJECT_ID\",\"environmentId\":\"$ENVIRONMENT_ID\",\"serviceId\":\"$SERVICE_ID\"}}")
          echo "$VARS" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          if body.get("errors"):
              raise SystemExit("Railway variables lookup failed: " + json.dumps(body["errors"]))
          variables = (body.get("data") or {}).get("variables") or {}
          if isinstance(variables, list):
              mapped = {}
              for item in variables:
                  if isinstance(item, dict) and item.get("name"):
                      mapped[item["name"]] = item.get("value") or ""
              variables = mapped
          url = str(variables.get("SUPABASE_URL") or "")
          if "fjxcdccgyhnvnnlnovcl" in url:
              raise SystemExit("Refusing: target SUPABASE_URL points at production ALCR")
          if url and "sgcdncjxauhsbunobmob" not in url:
              raise SystemExit("Refusing: target SUPABASE_URL is not staging sgcdncjxauhsbunobmob")
          print("supabase_url_host_ok=1")
          '
          CONNECT=$(curl -sS "$GQL" "${AUTH[@]}" \
            -d "{\"query\":\"mutation(\$id: String!, \$input: ServiceConnectInput!) { serviceConnect(id: \$id, input: \$input) { id } }\",\"variables\":{\"id\":\"$SERVICE_ID\",\"input\":{\"repo\":\"$GITHUB_REPOSITORY\",\"branch\":\"cursor/staging-voice-468b\"}}}")
          echo "$CONNECT" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          if body.get("errors"):
              raise SystemExit("serviceConnect failed: " + json.dumps(body["errors"]))
          print("connected_service=" + str(((body.get("data") or {}).get("serviceConnect") or {}).get("id") or ""))
          '
          echo "Railway staging Voice follows cursor/staging-voice-468b with no commit pin."

      - name: Point staging desk at the staging branch
        if: always() && steps.stage.outcome != 'skipped'
        timeout-minutes: 20
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGE_RESULT_PATH: ${{ runner.temp }}/stage-result.json
        run: node scripts/stage-desk-alias.js

      - name: Record the result on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STAGE_RESULT_PATH: ${{ runner.temp }}/stage-result.json
        run: node scripts/stage-pull-request-note.js

      - name: Fail when this pull request conflicted
        if: steps.stage.outcome == 'failure'
        run: exit 1
