# Staging validation

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: staging-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-db:
    name: Staging DB smoke and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check staging secrets configured
        id: secrets
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging secrets not set. Configure STAGING_SUPABASE_URL and STAGING_SUPABASE_SERVICE_ROLE_KEY."
            exit 0
          fi
          if echo "$STAGING_SUPABASE_URL" | grep -q 'fjxcdccgyhnvnnlnovcl'; then
            echo "Refusing: STAGING_SUPABASE_URL points at production ALCR"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: smoke:db
        if: steps.secrets.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run smoke:db

      - name: verify staging schema (lightweight)
        if: steps.secrets.outputs.configured == 'true'
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run verify:staging-schema

      - name: verify staging schema (catalog)
        if: steps.secrets.outputs.configured == 'true'
        continue-on-error: true
        id: catalog
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -n "$STAGING_DATABASE_URL" ]; then
            npm run verify:staging-schema:catalog
          else
            echo "SKIP catalog mode (STAGING_DATABASE_URL not set)"
          fi

      - name: catalog verify advisory
        if: steps.secrets.outputs.configured == 'true' && steps.catalog.outcome == 'failure'
        run: |
          echo "::warning::Catalog schema verify failed (often IPv6 from GitHub Actions). Lightweight verify already passed. Use Supabase pooler URI for STAGING_DATABASE_URL or run catalog locally."
