# PROPOSED .github/workflows/docs.yml
# Not installed by the PR that added it: the agent token has no `workflow` scope.
# To install: copy this file to .github/workflows/docs.yml in a commit made with a token that has workflow scope.
name: Docs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 07:17 EAT: catch links/staleness without a PR

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs links, frontmatter, generated reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Internal link check (lychee, offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml './**/*.md'
          fail: true

      - name: Frontmatter + stale-doc check (stale > 90 days warns)
        run: node scripts/docs/check-docs.js

      - name: Generated reference is up to date (schema.md, env.md)
        run: node scripts/docs/gen-reference.js --check
